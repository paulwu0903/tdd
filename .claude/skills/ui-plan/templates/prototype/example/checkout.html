<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結帳｜BLOCK SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="checkout">
<a class="skip" href="#main">跳到主要內容</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="brand-icon" data-sprite="grass"></span><span>BLOCK SHOP</span></a>
    <a class="bag" href="index.html" aria-label="購物車"><span data-sprite="chest"></span><span class="bag-count" id="cart-count" hidden>0</span></a>
  </div>
</header>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<main id="main" class="page">
  <a class="back" href="index.html">← 返回購物車</a>
  <ol class="steps" aria-label="結帳進度">
    <li class="done">購物車</li>
    <li aria-current="step">填寫資料</li>
    <li>完成</li>
  </ol>
  <h1 class="page-title"><span class="en" aria-hidden="true">CRAFTING</span>結帳</h1>
  <div id="view"></div>
</main>
<div class="sr-only" id="announcer" aria-live="polite"></div>
<dialog id="price-dialog" class="dialog" aria-labelledby="pd-title">
  <form method="dialog">
    <h2 class="panel-title" id="pd-title">價格已更新</h2>
    <p id="pd-text"></p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" value="cancel">再想想</button>
      <button class="btn btn-primary" value="confirm" autofocus>確認並送出</button>
    </div>
  </form>
</dialog>
<footer class="footer">
  <div class="footer-inner">
    <span class="footer-brand">BLOCK SHOP</span>
    <span>方塊雜貨鋪 · 單筆滿 NT$1,500 免運</span>
    <span>© 2026 BLOCK SHOP</span>
  </div>
</footer>
<script src="assets/app.js"></script>
</body>
</html>
